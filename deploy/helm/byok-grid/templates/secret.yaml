{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "byok-grid.secretName" . }}
  labels:
    {{- include "byok-grid.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.secrets.keys.sqliteDatabaseUrl }}: {{ required "secrets.values.sqliteDatabaseUrl is required" .Values.secrets.values.sqliteDatabaseUrl | quote }}
  {{ .Values.secrets.keys.sqliteAuthToken }}: {{ .Values.secrets.values.sqliteAuthToken | quote }}
  {{ .Values.secrets.keys.betterAuthSecret }}: {{ required "secrets.values.betterAuthSecret is required" .Values.secrets.values.betterAuthSecret | quote }}
  {{ .Values.secrets.keys.masterKey }}: {{ required "secrets.values.masterKey is required" .Values.secrets.values.masterKey | quote }}
  {{ .Values.secrets.keys.hatchetClientToken }}: {{ required "secrets.values.hatchetClientToken is required" .Values.secrets.values.hatchetClientToken | quote }}
  {{- if .Values.connectorRunner.enabled }}
  {{ .Values.secrets.keys.connectorRunnerSharedSecret }}: {{ required "secrets.values.connectorRunnerSharedSecret is required when connectorRunner.enabled=true" .Values.secrets.values.connectorRunnerSharedSecret | quote }}
  {{- end }}
  {{- if .Values.analyticsProjector.enabled }}
  {{ .Values.secrets.keys.clickhousePassword }}: {{ required "secrets.values.clickhousePassword is required when analyticsProjector.enabled=true" .Values.secrets.values.clickhousePassword | quote }}
  {{- end }}
{{- end }}
