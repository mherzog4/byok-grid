{{- if .Values.serviceAccount.create }}
{{- $root := . }}
{{- range $component := list "web" "worker" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "byok-grid.serviceAccountName" (list $root $component) }}
  labels:
    {{- include "byok-grid.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
  {{- with $root.Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- if .Values.connectorRunner.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "byok-grid.serviceAccountName" (list . "connectorRunner") }}
  labels:
    {{- include "byok-grid.labels" . | nindent 4 }}
    app.kubernetes.io/component: connector-runner
automountServiceAccountToken: false
{{- end }}
{{- if .Values.analyticsProjector.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "byok-grid.serviceAccountName" (list . "analyticsProjector") }}
  labels:
    {{- include "byok-grid.labels" . | nindent 4 }}
    app.kubernetes.io/component: analytics-projector
automountServiceAccountToken: false
{{- end }}
{{- end }}
