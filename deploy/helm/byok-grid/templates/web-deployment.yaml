apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "byok-grid.fullname" . }}-web
  labels:
    {{- include "byok-grid.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  {{- if not .Values.web.autoscaling.enabled }}
  replicas: {{ .Values.web.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "byok-grid.selectorLabels" (dict "root" . "component" "web") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.secrets.create }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.web.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "byok-grid.selectorLabels" (dict "root" . "component" "web") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "byok-grid.serviceAccountName" (list . "web") }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: web
          image: {{ include "byok-grid.image" (list . "web") | quote }}
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          envFrom:
            - configMapRef:
                name: {{ include "byok-grid.fullname" . }}-config
          env:
            - name: SQLITE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "byok-grid.secretName" . }}
                  key: {{ .Values.secrets.keys.sqliteDatabaseUrl }}
            - name: SQLITE_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "byok-grid.secretName" . }}
                  key: {{ .Values.secrets.keys.sqliteAuthToken }}
                  optional: true
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "byok-grid.secretName" . }}
                  key: {{ .Values.secrets.keys.betterAuthSecret }}
            - name: BYOK_GRID_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "byok-grid.secretName" . }}
                  key: {{ .Values.secrets.keys.masterKey }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.connectorRunner.enabled }}
            - name: connector-registry
              mountPath: /connectors
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.connectorRunner.enabled }}
        - name: connector-registry
          persistentVolumeClaim:
            claimName: {{ .Values.connectorRunner.existingClaim }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
