{{- if and .Values.worker.metrics.enabled (eq (int .Values.worker.metrics.port) (int .Values.worker.health.port)) }}
{{- fail "worker.metrics.port must differ from worker.health.port" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "byok-grid.fullname" . }}-worker
  labels:
    {{- include "byok-grid.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "byok-grid.selectorLabels" (dict "root" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.secrets.create }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.worker.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "byok-grid.selectorLabels" (dict "root" . "component" "worker") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "byok-grid.serviceAccountName" (list . "worker") }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: {{ include "byok-grid.image" (list . "worker") | quote }}
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          envFrom:
            - configMapRef:
                name: {{ include "byok-grid.fullname" . }}-config
          env:
            - name: SQLITE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "byok-grid.secretName" . }}
                  key: {{ .Values.secrets.keys.sqliteDatabaseUrl }}
            - name: SQLITE_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "byok-grid.secretName" . }}
                  key: {{ .Values.secrets.keys.sqliteAuthToken }}
                  optional: true
            - name: BYOK_GRID_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "byok-grid.secretName" . }}
                  key: {{ .Values.secrets.keys.masterKey }}
            - name: BYOK_GRID_ADDITIONAL_MASTER_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ include "byok-grid.secretName" . }}
                  key: {{ .Values.secrets.keys.additionalMasterKeys }}
                  optional: true
            - name: HATCHET_CLIENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "byok-grid.secretName" . }}
                  key: {{ .Values.secrets.keys.hatchetClientToken }}
            {{- if .Values.connectorRunner.enabled }}
            - name: CONNECTOR_RUNNER_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "byok-grid.secretName" . }}
                  key: {{ .Values.secrets.keys.connectorRunnerSharedSecret }}
            {{- end }}
          ports:
            - name: health
              containerPort: {{ .Values.worker.health.port }}
              protocol: TCP
            {{- if .Values.worker.metrics.enabled }}
            - name: app-metrics
              containerPort: {{ .Values.worker.metrics.port }}
              protocol: TCP
            {{- end }}
          readinessProbe:
            exec:
              command:
                - node
                - -e
                - >-
                  fetch('http://127.0.0.1:{{ .Values.worker.health.port }}/health').then(async (response) => { const body = await response.json(); if (body.status !== 'HEALTHY') process.exit(1) }).catch(() => process.exit(1))
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.connectorRunner.enabled }}
            - name: connector-registry
              mountPath: /connectors
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.connectorRunner.enabled }}
        - name: connector-registry
          persistentVolumeClaim:
            claimName: {{ .Values.connectorRunner.existingClaim }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
