apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "byok-grid.fullname" . }}-worker
  labels:
    {{- include "byok-grid.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "byok-grid.selectorLabels" (dict "root" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.secrets.create }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.worker.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "byok-grid.selectorLabels" (dict "root" . "component" "worker") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "byok-grid.serviceAccountName" (list . "worker") }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: {{ include "byok-grid.image" (list . "worker") | quote }}
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          envFrom:
            - configMapRef:
                name: {{ include "byok-grid.fullname" . }}-config
          env:
            - name: SQLITE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "byok-grid.secretName" . }}
                  key: {{ .Values.secrets.keys.sqliteDatabaseUrl }}
            - name: SQLITE_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "byok-grid.secretName" . }}
                  key: {{ .Values.secrets.keys.sqliteAuthToken }}
                  optional: true
            - name: BYOK_GRID_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "byok-grid.secretName" . }}
                  key: {{ .Values.secrets.keys.masterKey }}
            - name: HATCHET_CLIENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "byok-grid.secretName" . }}
                  key: {{ .Values.secrets.keys.hatchetClientToken }}
            {{- if .Values.connectorRunner.enabled }}
            - name: CONNECTOR_RUNNER_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "byok-grid.secretName" . }}
                  key: {{ .Values.secrets.keys.connectorRunnerSharedSecret }}
            {{- end }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.connectorRunner.enabled }}
            - name: connector-registry
              mountPath: /connectors
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.connectorRunner.enabled }}
        - name: connector-registry
          persistentVolumeClaim:
            claimName: {{ .Values.connectorRunner.existingClaim }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
