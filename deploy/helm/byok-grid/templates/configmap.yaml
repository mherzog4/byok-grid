apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "byok-grid.fullname" . }}-config
  labels:
    {{- include "byok-grid.labels" . | nindent 4 }}
data:
  BETTER_AUTH_URL: {{ .Values.app.publicUrl | quote }}
  BYOK_GRID_SIGNUP_MODE: {{ .Values.app.signupMode | quote }}
  BYOK_GRID_EMAIL_MODE: {{ .Values.app.email.mode | quote }}
  SMTP_FROM_EMAIL: {{ .Values.app.email.smtp.fromEmail | quote }}
  SMTP_FROM_NAME: {{ .Values.app.email.smtp.fromName | quote }}
  SMTP_HOST: {{ .Values.app.email.smtp.host | quote }}
  SMTP_PORT: {{ .Values.app.email.smtp.port | quote }}
  SMTP_REQUIRE_TLS: {{ .Values.app.email.smtp.requireTls | quote }}
  SMTP_SECURE: {{ .Values.app.email.smtp.secure | quote }}
  BYOK_GRID_SESSION_EXPIRES_IN_SECONDS: {{ .Values.app.session.expiresInSeconds | quote }}
  BYOK_GRID_SESSION_REFRESH_ENABLED: {{ .Values.app.session.refreshEnabled | quote }}
  BYOK_GRID_SESSION_UPDATE_AGE_SECONDS: {{ .Values.app.session.updateAgeSeconds | quote }}
  BYOK_GRID_MASTER_KEY_ID: {{ .Values.worker.masterKeyId | default "v1" | quote }}
  HATCHET_CLIENT_API_URL: {{ .Values.worker.hatchet.apiUrl | quote }}
  HATCHET_CLIENT_HOST_PORT: {{ .Values.worker.hatchet.hostPort | quote }}
  HATCHET_CLIENT_TLS_STRATEGY: {{ .Values.worker.hatchet.tlsStrategy | quote }}
  HATCHET_CLIENT_WORKER_HEALTHCHECK_ENABLED: 'true'
  HATCHET_CLIENT_WORKER_HEALTHCHECK_PORT: {{ .Values.worker.health.port | quote }}
  BYOK_GRID_METRICS_ENABLED: {{ .Values.worker.metrics.enabled | quote }}
  BYOK_GRID_METRICS_PORT: {{ .Values.worker.metrics.port | quote }}
  BULK_RUN_MAX_ROWS: {{ .Values.web.bulkRunLimits.maxRows | quote }}
  BULK_RUN_MAX_PROVIDER_REQUESTS: {{ .Values.web.bulkRunLimits.maxProviderRequests | quote }}
  BULK_RUN_MAX_OUTPUT_TOKENS: {{ .Values.web.bulkRunLimits.maxOutputTokens | quote }}
  BULK_RUN_EXPANSION_CHUNK_SIZE: {{ .Values.worker.limits.bulkRunExpansionChunkSize | quote }}
  AUTOMATIC_RUN_MAX_PER_ROW_CHANGE: {{ .Values.worker.limits.automaticRunMaxPerRowChange | quote }}
  AUTOMATIC_WRITEBACK_MAX_PER_ROW_CHANGE: {{ .Values.worker.limits.automaticWritebackMaxPerRowChange | quote }}
  SOURCE_SCHEDULER_POLL_SECONDS: {{ .Values.worker.limits.sourceSchedulerPollSeconds | quote }}
  WORKFLOW_DISPATCH_POLL_MS: {{ .Values.worker.limits.workflowDispatchPollMs | quote }}
  {{- if .Values.connectorRunner.enabled }}
  BYOK_GRID_CONNECTOR_REGISTRY_PATH: {{ .Values.connectorRunner.registryPath | quote }}
  BYOK_GRID_CONNECTOR_REGISTRY_SIGNATURE_PATH: {{ .Values.connectorRunner.registrySignaturePath | quote }}
  BYOK_GRID_CONNECTOR_TRUST_KEYS: {{ .Values.connectorRunner.trustKeys | quote }}
  BYOK_GRID_ALLOW_UNSIGNED_CONNECTOR_REGISTRY: 'false'
  CONNECTOR_RUNNER_URL: {{ printf "http://%s-connector-runner:%v" (include "byok-grid.fullname" .) .Values.connectorRunner.service.port | quote }}
  {{- end }}
