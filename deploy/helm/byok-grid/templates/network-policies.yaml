{{- if .Values.networkPolicy.enabled }}
{{- if and .Values.ingress.enabled (eq (len .Values.networkPolicy.ingress.web) 0) }}
{{- fail "networkPolicy.ingress.web must contain at least one trusted peer when ingress.enabled=true" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "byok-grid.fullname" . }}-default-deny-ingress
  labels:
    {{- include "byok-grid.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "byok-grid.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "byok-grid.fullname" . }}-web-ingress
  labels:
    {{- include "byok-grid.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "byok-grid.selectorLabels" (dict "root" . "component" "web") | nindent 6 }}
  policyTypes:
    - Ingress
  {{- if .Values.networkPolicy.ingress.web }}
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.ingress.web | nindent 8 }}
      ports:
        - protocol: TCP
          port: 3000
  {{- else }}
  ingress: []
  {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "byok-grid.fullname" . }}-worker-monitoring-ingress
  labels:
    {{- include "byok-grid.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "byok-grid.selectorLabels" (dict "root" . "component" "worker") | nindent 6 }}
  policyTypes:
    - Ingress
  {{- if .Values.networkPolicy.ingress.monitoring }}
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.ingress.monitoring | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ .Values.worker.health.port }}
        {{- if .Values.worker.metrics.enabled }}
        - protocol: TCP
          port: {{ .Values.worker.metrics.port }}
        {{- end }}
  {{- else }}
  ingress: []
  {{- end }}
{{- if .Values.connectorRunner.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "byok-grid.fullname" . }}-connector-runner
  labels:
    {{- include "byok-grid.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "byok-grid.selectorLabels" (dict "root" . "component" "connector-runner") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "byok-grid.selectorLabels" (dict "root" . "component" "worker") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 4319
  egress: []
{{- end }}
{{- if .Values.networkPolicy.egress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "byok-grid.fullname" . }}-default-deny-runtime-egress
  labels:
    {{- include "byok-grid.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [{{ include "byok-grid.name" . }}]
      - key: app.kubernetes.io/instance
        operator: In
        values: [{{ .Release.Name }}]
      - key: app.kubernetes.io/component
        operator: In
        values: [web, worker, analytics-projector]
  policyTypes:
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "byok-grid.fullname" . }}-web-egress
  labels:
    {{- include "byok-grid.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "byok-grid.selectorLabels" (dict "root" . "component" "web") | nindent 6 }}
  policyTypes:
    - Egress
  {{- if or .Values.networkPolicy.egress.shared .Values.networkPolicy.egress.web }}
  egress:
    {{- with .Values.networkPolicy.egress.shared }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.networkPolicy.egress.web }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- else }}
  egress: []
  {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "byok-grid.fullname" . }}-worker-egress
  labels:
    {{- include "byok-grid.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "byok-grid.selectorLabels" (dict "root" . "component" "worker") | nindent 6 }}
  policyTypes:
    - Egress
  {{- if or .Values.networkPolicy.egress.shared .Values.networkPolicy.egress.worker .Values.connectorRunner.enabled }}
  egress:
    {{- with .Values.networkPolicy.egress.shared }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.networkPolicy.egress.worker }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if .Values.connectorRunner.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "byok-grid.selectorLabels" (dict "root" . "component" "connector-runner") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 4319
    {{- end }}
  {{- else }}
  egress: []
  {{- end }}
{{- if .Values.analyticsProjector.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "byok-grid.fullname" . }}-analytics-projector-egress
  labels:
    {{- include "byok-grid.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "byok-grid.selectorLabels" (dict "root" . "component" "analytics-projector") | nindent 6 }}
  policyTypes:
    - Egress
  {{- if or .Values.networkPolicy.egress.shared .Values.networkPolicy.egress.analyticsProjector }}
  egress:
    {{- with .Values.networkPolicy.egress.shared }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.networkPolicy.egress.analyticsProjector }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- else }}
  egress: []
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
