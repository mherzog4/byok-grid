[package]
name = "byok-grid-connector-runner"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.100"
axum = "0.8.6"
ed25519-dalek = "2.2.0"
hex = "0.4.3"
hmac = "0.12.1"
http = "1.3.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tokio = { version = "1.47.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6.6", features = ["limit", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
wasmtime = { version = "=47.0.3", default-features = false, features = ["anyhow", "cranelift", "runtime", "std", "wat"] }
wat = "1.240.0"

[dev-dependencies]
libc = "0.2.189"
tempfile = "3.23.0"
