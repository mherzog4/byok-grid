name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.10-alpine3.24@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: byok_grid
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d byok_grid"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      BETTER_AUTH_SECRET: ci-only-secret-not-for-production-123456
      BETTER_AUTH_URL: http://localhost:3000
      BYOK_GRID_MASTER_KEY: Y2ktb25seS1ub3QtYS1wcm9kLWtleS0xMjM0NTY3ODk=
      BYOK_GRID_MASTER_KEY_ID: ci-v1
      HATCHET_CLIENT_TOKEN: ci-compose-validation-only
      SQLITE_DATABASE_URL: file:./data/byok-grid-ci.sqlite

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Verify workflow supply-chain policy
        run: npm run ci:verify-workflows

      - name: Install locked dependencies
        run: npm ci --strict-allow-scripts

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3

      - name: Create least-privilege database roles
        env:
          PGPASSWORD: postgres
        run: >-
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d byok_grid
          -c "CREATE ROLE byok_grid_web LOGIN PASSWORD 'byok-grid-web-ci' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS"
          -c "CREATE ROLE byok_grid_worker LOGIN PASSWORD 'byok-grid-worker-ci' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT BYPASSRLS"

      - name: Apply SQLite migrations
        run: npm run db:migrate

      - name: Apply legacy PostgreSQL compatibility migrations
        env:
          MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/byok_grid
        run: npm run db:postgres:migrate

      - name: Check formatting
        run: npm run format:check

      - name: Verify release metadata
        run: npm run release:verify-version

      - name: Lint
        run: npm run lint

      - name: Lint connector runner
        run: npm run lint:connector-runner

      - name: Type-check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Run connector runner tests
        run: npm run test:connector-runner

      - name: Run legacy PostgreSQL compatibility tests
        env:
          RLS_DATABASE_URL: postgresql://byok_grid_web:byok-grid-web-ci@127.0.0.1:5432/byok_grid
          RLS_WORKER_DATABASE_URL: postgresql://byok_grid_worker:byok-grid-worker-ci@127.0.0.1:5432/byok_grid
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/byok_grid
        run: npm test --workspace=@byok-grid/db

      - name: Build production artifacts
        run: npm run build

      - name: Verify standalone web signal drain
        run: npm run drill:web-drain

      - name: Build production container targets
        run: |
          docker build --target web --tag byok-grid-web:ci .
          docker build --target workflow-worker --tag byok-grid-workflow-worker:ci .
          docker build --target migration --tag byok-grid-migration:ci .
          docker build --target maintenance --tag byok-grid-maintenance:ci .
          docker build --target connector-runner --tag byok-grid-connector-runner:ci .
          docker build --target airbyte-destination --tag byok-grid-airbyte-destination:ci .
          docker build --target analytics-projector --tag byok-grid-analytics-projector:ci .

      - name: Assert SQLite-only Node runtime images
        run: |
          set -euo pipefail
          maintenance_volume="byok-grid-ci-maintenance-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker volume rm --force "$maintenance_volume" >/dev/null' EXIT
          docker run --rm --entrypoint node byok-grid-workflow-worker:ci -e "let leaked=false; try { require.resolve('postgres'); leaked=true } catch {} if (leaked) process.exit(1)"
          docker run --rm --entrypoint node byok-grid-analytics-projector:ci -e "let leaked=false; try { require.resolve('postgres'); leaked=true } catch {} if (leaked) process.exit(1)"
          docker run --rm --entrypoint node byok-grid-workflow-worker:ci --import tsx --input-type=module -e "await import('./packages/connectors/src/sandbox-schema.ts')"
          docker run --rm --entrypoint node byok-grid-workflow-worker:ci --import tsx --input-type=module -e "await import('./packages/db/src/sqlite/operational-metrics.ts'); await import('./apps/workflow-worker/src/operational-metrics.ts')"
          docker run --rm --entrypoint node byok-grid-workflow-worker:ci -e "require.resolve('prom-client')"
          docker volume create "$maintenance_volume"
          docker run --rm --volume "$maintenance_volume:/data" -e SQLITE_DATABASE_URL=file:/data/ci.sqlite byok-grid-migration:ci
          docker run --rm --volume "$maintenance_volume:/data" -e SQLITE_DATABASE_URL=file:/data/ci.sqlite byok-grid-maintenance:ci backup /data/backups/ci.sqlite
          docker run --rm --volume "$maintenance_volume:/data" byok-grid-maintenance:ci verify /data/backups/ci.sqlite
          docker run --rm --volume "$maintenance_volume:/data" byok-grid-maintenance:ci restore /data/backups/ci.sqlite /data/restored/ci.sqlite

      - name: Verify connector SDK package contents
        run: npm run pack:connector-sdk

      - name: Validate local infrastructure definition
        run: docker compose config --quiet

      - name: Validate production Helm chart
        run: npm run helm:verify

      - name: Audit dependencies
        run: npm audit --audit-level=moderate
