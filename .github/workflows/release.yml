name: Release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17.10-alpine3.24@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: byok_grid
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d byok_grid"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BETTER_AUTH_SECRET: release-verification-secret-not-for-production
      BETTER_AUTH_URL: http://localhost:3000
      BYOK_GRID_MASTER_KEY: Y2ktb25seS1ub3QtYS1wcm9kLWtleS0xMjM0NTY3ODk=
      BYOK_GRID_MASTER_KEY_ID: release-ci-v1
      HATCHET_CLIENT_TOKEN: release-verification-only
      SQLITE_DATABASE_URL: file:./data/byok-grid-release.sqlite
    outputs:
      matrix: ${{ steps.release.outputs.matrix }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Verify workflow supply-chain policy
        run: npm run ci:verify-workflows

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3

      - name: Install locked dependencies
        run: npm ci --strict-allow-scripts

      - name: Verify release contract
        id: release
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          npm run release:verify-version -- "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "matrix=$(npm run --silent release:matrix)" >> "$GITHUB_OUTPUT"

      - name: Create least-privilege database roles
        env:
          PGPASSWORD: postgres
        run: >-
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d byok_grid
          -c "CREATE ROLE byok_grid_web LOGIN PASSWORD 'byok-grid-web-ci' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS"
          -c "CREATE ROLE byok_grid_worker LOGIN PASSWORD 'byok-grid-worker-ci' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT BYPASSRLS"

      - name: Apply database migrations
        env:
          MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/byok_grid
        run: |
          npm run db:migrate
          npm run db:postgres:migrate

      - name: Run repository verification
        run: |
          npm run format:check
          npm run lint
          npm run lint:connector-runner
          npm run typecheck
          npm test
          npm run test:connector-runner
          npm run build
          npm run drill:web-drain
          npm run pack:connector-sdk
          npm run helm:verify
          docker compose config --quiet

      - name: Run legacy PostgreSQL compatibility tests
        env:
          RLS_DATABASE_URL: postgresql://byok_grid_web:byok-grid-web-ci@127.0.0.1:5432/byok_grid
          RLS_WORKER_DATABASE_URL: postgresql://byok_grid_worker:byok-grid-worker-ci@127.0.0.1:5432/byok_grid
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/byok_grid
        run: npm test --workspace=@byok-grid/db

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

  images:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.verify.outputs.matrix) }}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          # Commit-scoped tags are staging identities. The version tag is
          # published only after every image in the matrix passes scanning.
          tags: type=sha,format=long,prefix=sha-
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}

      - name: Build and push multi-platform image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max
          provenance: mode=max
          sbom: true

      - name: Scan immutable image digest
        # v0.36.0, pinned after the 2026 Trivy tag-hijacking incident.
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        env:
          TRIVY_EXIT_ON_EOL: '1'
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Attest image digest
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Record immutable digest
        shell: bash
        run: |
          mkdir -p release-digests
          printf '%s@%s\n' "$IMAGE" '${{ steps.build.outputs.digest }}' > "release-digests/${{ matrix.target }}.txt"

      - name: Upload digest record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-digest-${{ matrix.target }}
          path: release-digests/${{ matrix.target }}.txt
          retention-days: 14

  publish_images:
    needs: [verify, images]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download verified image digest records
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-digest-*
          path: release-digests
          merge-multiple: true

      - name: Publish version tags from verified digests
        shell: bash
        run: |
          set -euo pipefail
          for record in release-digests/*.txt; do
            reference="$(<"$record")"
            image="${reference%@*}"
            docker buildx imagetools create --tag "$image:$VERSION" "$reference"
          done

  publish:
    needs: [verify, images, publish_images]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3

      - name: Install locked dependencies
        run: npm ci --strict-allow-scripts

      - name: Download image digest records
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-digest-*
          path: release-digests
          merge-multiple: true

      - name: Package release files
        shell: bash
        run: >-
          npm run release:package --
          --version "$VERSION"
          --digests-dir release-digests
          --output-dir dist/release

      - name: Attest release files
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: dist/release/*

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$VERSION" == *-* ]]; then
            gh release create "v$VERSION" dist/release/* --verify-tag --generate-notes --prerelease --latest=false
          else
            gh release create "v$VERSION" dist/release/* --verify-tag --generate-notes --latest
          fi
